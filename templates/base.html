
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Municípios do Nordeste</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header class="topo">
        <p class="sobrescrito">Cadastro territorial • IBGE</p>
        <h1>Municípios do <span>Nordeste</span></h1>
    </header>

    <main class="conteudo">

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <div class="aviso {{ categoria }}">
                    {{ mensagem }}
                </div>
            {% endfor %}
        {% endwith %}

        {% block conteudo %}{% endblock %}

    </main>

</body>
</html>
